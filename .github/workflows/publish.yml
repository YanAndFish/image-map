name: publish

on:
  push:
    tags:
      - v*

jobs:
  build-native:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bin: image-map
            build: cargo
          - os: macos-14-large
            target: x86_64-apple-darwin
            bin: image-map
            build: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: image-map
            build: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: image-map
            build: zigbuild
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: image-map.exe
            build: cargo
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: image-map.exe
            build: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.build == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup zig
        if: matrix.build == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Build
        shell: bash
        run: |
          cd src-native
          if [ "${{ matrix.build }}" = "zigbuild" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-map-${{ matrix.target }}
          path: src-native/target/${{ matrix.target }}/release/${{ matrix.bin }}

  publish:
    name: publish-npm
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries into platform packages
        shell: bash
        run: |
          mkdir -p packages/image-map-darwin-arm64/bin
          mkdir -p packages/image-map-darwin-x64/bin
          mkdir -p packages/image-map-linux-arm64/bin
          mkdir -p packages/image-map-linux-x64/bin
          mkdir -p packages/image-map-win32-arm64/bin
          mkdir -p packages/image-map-win32-x64/bin

          cp "artifacts/image-map-aarch64-apple-darwin/image-map" packages/image-map-darwin-arm64/bin/image-map
          cp "artifacts/image-map-x86_64-apple-darwin/image-map" packages/image-map-darwin-x64/bin/image-map
          cp "artifacts/image-map-aarch64-unknown-linux-gnu/image-map" packages/image-map-linux-arm64/bin/image-map
          cp "artifacts/image-map-x86_64-unknown-linux-gnu/image-map" packages/image-map-linux-x64/bin/image-map
          cp "artifacts/image-map-aarch64-pc-windows-msvc/image-map.exe" packages/image-map-win32-arm64/bin/image-map.exe
          cp "artifacts/image-map-x86_64-pc-windows-msvc/image-map.exe" packages/image-map-win32-x64/bin/image-map.exe

          chmod +x packages/image-map-darwin-arm64/bin/image-map
          chmod +x packages/image-map-darwin-x64/bin/image-map
          chmod +x packages/image-map-linux-arm64/bin/image-map
          chmod +x packages/image-map-linux-x64/bin/image-map
          chmod +x packages/image-map/bin/image-map

      - name: Build main package
        run: pnpm -C packages/image-map build

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm -C packages/image-map-darwin-arm64 publish --access public --no-git-checks
          pnpm -C packages/image-map-darwin-x64 publish --access public --no-git-checks
          pnpm -C packages/image-map-linux-arm64 publish --access public --no-git-checks
          pnpm -C packages/image-map-linux-x64 publish --access public --no-git-checks
          pnpm -C packages/image-map-win32-arm64 publish --access public --no-git-checks
          pnpm -C packages/image-map-win32-x64 publish --access public --no-git-checks

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -C packages/image-map publish --access public --no-git-checks

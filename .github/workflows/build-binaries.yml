name: build-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bin: image-map
          - os: macos-13
            target: x86_64-apple-darwin
            bin: image-map
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: image-map
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: image-map.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          cd src-native
          cargo build --release --target "${{ matrix.target }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-map-${{ matrix.target }}
          path: src-native/target/${{ matrix.target }}/release/${{ matrix.bin }}

name: build-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bin: image-map
            build: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: image-map
            build: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: image-map
            build: zigbuild
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: image-map.exe
            build: cargo
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: image-map.exe
            build: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.build == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup zig
        if: matrix.build == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Build
        shell: bash
        run: |
          cd src-native
          if [ "${{ matrix.build }}" = "zigbuild" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-map-${{ matrix.target }}
          path: src-native/target/${{ matrix.target }}/release/${{ matrix.bin }}

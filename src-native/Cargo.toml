[package]
name = "image-map"
version = "0.1.0"
edition = "2024"
description = "High-performance image tile generator driven by Rust"
license = "MIT"

[dependencies]
image = "0.25"
fast_image_resize = "5"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
